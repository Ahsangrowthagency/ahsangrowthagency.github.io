<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahsan Growth Agency | Digital Marketing Lahore</title>
<style>
:root{--bg:#070b1a;--card:#0f1630;--line:#1f2a55;--red:#e11d2e;--blue:#1d4ed8;--text:#f1f5ff;--mut:#9fb0d9;--wa:#25d366;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(7,11,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:800;font-size:18px}.logo b{color:var(--red)}.logo i{color:#5b8cff;font-style:normal}
nav{display:flex;gap:18px;align-items:center}
nav a{color:var(--mut);font-size:14px}nav a:hover{color:#fff}
.burger{display:none;background:none;border:1px solid var(--line);color:#fff;font-size:22px;border-radius:8px;padding:2px 10px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font-weight:700;font-size:15px;padding:12px 20px;border-radius:10px;color:#fff;background:linear-gradient(90deg,var(--red),var(--blue))}
.btn.wa{background:var(--wa);color:#04210f}.btn.line{background:transparent;border:1px solid var(--line)}
.hero{position:relative;padding:70px 0 60px;background:radial-gradient(800px 400px at 85% 0,#1d4ed855,transparent),radial-gradient(700px 400px at 0 20%,#e11d2e40,transparent)}
.hero svg.bg{position:absolute;inset:0;width:100%;height:100%;opacity:.35;pointer-events:none}
.hero .wrap{position:relative}
.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:4px 14px;font-size:13px;color:var(--mut);margin-bottom:14px}
h1{font-size:clamp(30px,6vw,52px);line-height:1.1;margin-bottom:14px}
h1 span{background:linear-gradient(90deg,#ff4d5e,#5b8cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:560px;margin-bottom:22px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:26px;margin-top:30px;flex-wrap:wrap}.stats b{font-size:24px;display:block}.stats small{color:var(--mut)}
section{padding:56px 0}
h2{font-size:clamp(24px,4vw,34px);margin-bottom:6px}.sub{color:var(--mut);margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.card h3{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:20px}
.card h3 svg{width:40px;height:40px;flex:none}
.card ul{list-style:none;padding:0;margin-bottom:16px}
.card li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
.card li a{font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;background:linear-gradient(90deg,var(--red),var(--blue));white-space:nowrap}
  .card .btn{width:100%;justify-content:center}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.info .card b{display:block;color:#5b8cff;font-size:13px;margin-bottom:4px}.ci{display:flex;align-items:center;gap:14px}.ci>div{min-width:0;word-break:break-word}.ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}.ic svg{width:24px;height:24px;display:block}
.stars{color:#fbbf24;letter-spacing:2px}
#revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px}
footer{border-top:1px solid var(--line);padding:26px 0 90px;text-align:center;color:var(--mut);font-size:14px}
.fab{position:fixed;z-index:30;border:0;cursor:pointer;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-family:inherit}
.fab svg{width:22px;height:22px;flex:none;fill:currentColor}
#chatFab{background:var(--red)}#callFab{background:var(--blue)}#waFab{background:var(--wa);color:#04210f}
/* Desktop: round icon buttons on the right */
@media(min-width:761px){.fab{right:20px;width:52px;height:52px;border-radius:50%;box-shadow:0 6px 20px #0008}.fab span{display:none}
#waFab{bottom:20px}#callFab{bottom:80px}#chatFab{bottom:140px}}
/* Mobile: bottom bar, 3 equal buttons, never covers content */
@media(max-width:760px){.fab{bottom:0;width:33.3334%;height:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);border-radius:0;font-size:14px;box-shadow:0 -4px 16px #0006}
#chatFab{left:0}#callFab{left:33.3333%}#waFab{left:66.6667%}
footer{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:400px}
input,textarea{width:100%;background:#0a1028;border:1px solid var(--line);color:#fff;border-radius:10px;padding:11px;font:inherit;margin:8px 0}
#starPick span{font-size:34px;cursor:pointer;color:#475085}#starPick span.on{color:#fbbf24}
#chat{position:fixed;right:12px;left:12px;max-width:380px;margin-left:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:min(520px,75vh);background:var(--card);border:1px solid var(--line);border-radius:16px;display:none;flex-direction:column;z-index:60;overflow:hidden}
#chat.on{display:flex}
.ch{padding:12px 14px;background:linear-gradient(90deg,var(--red),var(--blue));display:flex;justify-content:space-between;font-weight:700}
.ch button{background:none;border:0;color:#fff;font-size:20px}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:9px 12px;border-radius:12px;font-size:14px;white-space:pre-line}
.m.b{background:#18224a;align-self:flex-start}.m.u{background:var(--blue);align-self:flex-end}
.q{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}
.q button{background:#18224a;border:1px solid var(--line);color:#fff;border-radius:99px;font-size:12px;padding:5px 11px;cursor:pointer}
.cf{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}.cf input{margin:0}
@media(max-width:760px){nav{display:none;position:absolute;top:60px;left:0;right:0;flex-direction:column;background:var(--bg);padding:16px;border-bottom:1px solid var(--line)}nav.on{display:flex}.burger{display:block}}
.pay small{display:block;color:var(--mut);font-size:12px;margin-top:10px}.pay b{display:block;font-size:17px}
.badge{display:inline-block;color:#fff;font-weight:800;font-size:13px;padding:5px 12px;border-radius:99px;margin-bottom:4px}
.pay .num{font-size:22px;font-weight:800;letter-spacing:1px;margin:2px 0 14px;word-break:break-all}
.pay.na{opacity:.65}.plogo{display:flex;align-items:center;gap:12px;margin-bottom:10px}.plogo img{width:48px;height:48px;flex:none;border-radius:12px;display:block;background:#fff}.plogo span{font-weight:800;font-size:18px;line-height:1.2}
.notice{margin-top:26px;background:#2a2308;border:1px solid #8a6d12;border-radius:14px;padding:18px 20px;color:#fde68a}
label{display:block;font-size:13px;color:var(--mut);margin-top:12px}
select{width:100%;background:#0a1028;border:1px solid var(--line);color:#fff;border-radius:10px;padding:11px;font:inherit;margin:8px 0}
.formbox{max-width:620px}.err{color:#ff8da1;font-size:14px;min-height:20px;margin:6px 0}.hint{display:block;color:var(--mut);margin-top:10px}
.faqs{display:grid;gap:12px}.faq summary{cursor:pointer;font-weight:700}.faq p{color:var(--mut);margin-top:10px;font-size:15px}
.terms{margin-top:22px}.terms ul{list-style:disc;padding-left:20px;display:grid;gap:8px;color:var(--mut);font-size:14px}.terms li{display:list-item;border:0;padding:0}
nav{gap:14px}nav a{font-size:13.5px}
.trust{margin-top:22px}.trust ul{list-style:none;padding:0;display:grid;gap:10px;margin:0}
.trust li{display:block;border:0;padding:0 0 0 30px;position:relative;color:var(--text);font-size:15px}
.trust li:before{content:"\2714";position:absolute;left:0;top:0;color:#25d366;font-weight:800}

.owner{display:grid;grid-template-columns:200px 1fr;gap:28px;align-items:center}
.owner .ph{position:relative;width:200px;height:200px;border-radius:50%;padding:4px;background:linear-gradient(135deg,var(--red),var(--blue))}
.owner .ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:50%}
.owner h3{font-size:28px;margin:6px 0 2px}.owner .role{color:#5b8cff;font-weight:700;margin-bottom:12px}
.owner p{color:var(--mut);margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.chips span{border:1px solid var(--line);background:#0a1028;border-radius:99px;padding:5px 13px;font-size:13px}
.odet{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:18px}.odet div{background:#0a1028;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;word-break:break-word}.odet b{display:block;color:#5b8cff;font-size:12px;margin-bottom:2px}
@media(max-width:700px){.owner{grid-template-columns:1fr;text-align:center}.owner .ph{width:180px;height:180px;margin:auto}.owner .chips{justify-content:center}}

.nav{justify-content:flex-start}nav{margin-inline-start:auto}
#lang{width:auto;margin:0;margin-inline-start:14px;padding:6px 8px;font-size:13px;border-radius:8px;cursor:pointer}
@media(max-width:760px){#lang{order:2;margin-inline-start:auto}.burger{order:3;margin-inline-start:10px}}
